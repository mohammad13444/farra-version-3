<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faira - Resort Finder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @font-face {
            font-family: "Bonyade Koodak VF";
            src: url("./BonyadeKoodak-VF.ttf") format("truetype");
            font-weight: 100 900;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Bonyade Koodak VF", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            position: relative;
        }

        /* Map - Full Screen */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-container {
            background: #f5f5f5;
        }

        /* Overlay Container for UI Elements */
        .overlay-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .overlay-ui > * {
            pointer-events: auto;
        }

        .home-container{
            margin-left: 24px;
            margin-right: 24px;
        }

        /* Header with Blur Effect */
        .header {
            position: relative;
            display: flex;
            align-items: center;
      justify-content: space-between;
            overflow: visible;



               width: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      padding: 16px 13px;
      /* پدینگ داخلی 13px به 0 تغییر کرد چون پدینگ کانتینر 24px است */
      border-radius: 16px;
      padding-top: 24px;
        }

          /* ⚠️ توجه: آیکون‌های چپ و راست هدر باید خارج از پدینگ کانتینر قرار می‌گرفتند. 
           اما برای حفظ کد شما، پدینگ header به 0 تغییر کرد تا پدینگ 24px از body اعمال شود. */


    .star {
      color: #8e83e6;
      font-size: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #8877f3;
    }

        .header-blur {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background-color: #f5f5f525;
            height: 120px;
            pointer-events: none;
            z-index: 0;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            mask-image: linear-gradient(
                to bottom,
                rgba(0,0,0,1)    0%,
                rgba(0,0,0,0.95) 20%,
                rgba(0,0,0,0.80) 40%,
                rgba(0,0,0,0.55) 55%,
                rgba(0,0,0,0.30) 70%,
                rgba(0,0,0,0.15) 82%,
                rgba(0,0,0,0.05) 92%,
                rgba(0,0,0,0.00) 100%
            );
        }

        .header > *:not(.header-blur) {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #7B8CFF;
            font-style: italic;
            margin: 0 15px;
            letter-spacing: -0.5px;
        }

        .sparkle {
            color: #A8B5FF;
            font-size: 24px;
             display: flex;
            align-items: center;
        }

      
        /* Icon Bar with Blur */
        .icon-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            padding: 15px 20px;
            position: relative;
            margin-top: 40%;
        }

        .icon-item {
            width: 40px;
            height: 40px;
            border: 1px solid #7B8CFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7B8CFF;
            font-size: 24px;
        }

        .icon-badge {
            position: absolute;
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #7B8CFF;
            color: #7B8CFF;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 14px;
        }

        /* Map Markers */
        .custom-marker {
            background: transparent;
            border: none;
        }

/* خط 129: .kir */
/* خط 129: .kir - کادر بک‌گراند (سایز ثابت) */
.kir {
    width: 28px;        
    height: 28px;       
    display: flex; 
    align-items: center; 
    justify-content: center;
    
    border-radius: var(--Border-Radius-800, 32px);
    fill: none;
    padding: 0px;       
    box-sizing: border-box;
    flex-shrink: 0;
}


/* 👇 ابعاد آیکن واقعی داخل کادر */
.kir path { 
   stroke: var(--Icon-Default-Heading, #45454D);
    fill: none;
    /* 👇 فرمان اصلی برای کوچک کردن آیکن */
    transform: scale(0.65); 
    transform-origin: center; /* مطمئن می‌شیم از مرکز کوچک می‌شه */
}




        .resort-marker {
           color: var(--Text-Primary-On-Color, #E2E2FC);
text-align: center;

/* English/Body/Copy */
font-family: var(--Fonts-En-Primary, "Bonyade Koodak VF");
font-size: var(--Font-Copy-Body-Text-Size, 16px);
font-style: normal;
font-weight: 400;
line-height: var(--Font-Copy-Body-Line-Heigth, 20px); /* 125% */
            padding: var(--Spacing-200, 8px) var(--Spacing-300, 12px) var(--Border-Radius-200, 8px) var(--Spacing-300, 12px);
width: 90px;
            border-radius: var(--Border-Radius-800, 32px);
background: rgba(22, 22, 48, 0.50);
            white-space: nowrap;
            border: none;
            cursor: pointer;
        }

        /* Individual Resort Marker (Blue) */
        .individual-resort-marker {
            border-radius: var(--Border-Radius-800, 32px);
background: var(--Primary-500, #706DF2);
padding: var(--Spacing-200, 8px) var(--Spacing-300, 12px);
color: var(--Text-Primary-On-Color, #E2E2FC);
width: 75px;
/* English/Body/Strong Small Body */
font-family: var(--Fonts-En-Primary, "Bonyade Koodak VF");
font-size: var(--Font-Copy-Body-Sm-Text-Size, 14px);
font-style: normal;
font-weight: 700;
line-height: var(--Font-Copy-Body-Sm-Line-Heigth, 18px); /* 128.571% */
            white-space: nowrap;
            border: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Bottom Cards Container - Single Column */
        .cards-container {
            position: absolute;
            bottom: 130px;
            left: 0;
            width: 100%;
            max-height: 350px;
            overflow-x: auto;
            overflow-y: hidden;
            display: none;
            pointer-events: auto;
            z-index: 3;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding: 0 calc(50vw - 100px); /* 👈 فاصله از دو طرف */
        }

        .cards-wrapper {
            display: flex;
            gap: 15px;
        }

        .cards-container.active {
            display: block;
        }

        .resort-card {
            min-width: 190px;
            background: var(--Primary-100, #E2E2FC);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            display: block;
            scroll-snap-align: center; /* 👈 تغییر از start به center */
            flex-shrink: 0;
            padding-bottom: 0px;
            height: 220px;
        }

        .resort-card:hover {
            background: var(--Primary-200, #C6C5FA);
        }

        /* Card Image Section */
        .card-image {
            width: 190px;
            height: 155px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            padding: 5px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
                        border-radius: 20px;

            object-fit: cover;
            object-position: center;
        }

        /* Rating Badge */
        .card-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--Text-Primary-On-Color, #E2E2FC);
text-align: center;

/* English/Body/Strong Small Body */
font-family: var(--Fonts-En-Primary, "Bonyade Koodak VF");
font-size: var(--Font-Copy-Body-Sm-Text-Size, 14px);
font-style: normal;
font-weight: 700;
line-height: var(--Font-Copy-Body-Sm-Line-Heigth, 18px); /* 128.571% */
            padding: 0 var(--Spacing-200, 8px);
            padding-top: 3px;
            border-radius: var(--Border-Radius-300, 12px);
background: rgba(45, 44, 97, 0.50);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Price Overlay with Blur */
      .card-price-section {
    position: absolute;
    bottom: 13px;
    left: 12px;
    right: 12px;
    height: 38px;

    border-radius: var(--Border-Radius-800, 32px);
    background: rgba(226, 226, 252, 0.70);
    backdrop-filter: blur(6px);

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;           /* فاصله بین قیمت و آیکن */

    padding: 0 12px; 
    padding-right: 6px;   /* فقط فاصله چپ و راست */
    z-index: 10;
    box-sizing: border-box;
}

        .card-price {
            color: var(--Text-Default-Heading, #45454D);
            font-family: "Bonyade Koodak VF";
            font-size: 16px;
            font-weight: 700;
            line-height: 20px;
        }

        .card-price span {
            display: none;
        }

        .card-sparkle {
         display: flex; 
    align-items: center; 
    justify-content: center;
            color: #706DF2;
                flex-shrink: 0; /* اضافه کردم تا مطمئن بشیم فشرده نمیشه */

            
        }

        /* Card Content */
        .card-content {
            padding: 10px 10px 0px 20px;
        }

        .card-title {
            color: var(--Text-Default-Heading, #45454D);
            font-family: "Bonyade Koodak VF";
            font-size: 16px;
            font-weight: 700;
            line-height: 20px;
            margin-bottom: 4px;
        }

        .card-location {
            color: var(--Text-Default-Caption, #8A8999);
            font-family: "Bonyade Koodak VF";
            font-size: 14px;
            font-weight: 400;
            line-height: 18px;
            padding: 0px;
        }

 .fara-bottom-nav {
      position: fixed;
      left: 24px;
      /* پدینگ چپ صفحه */
      right: 24px;
      /* پدینگ راست صفحه */
      bottom: 35px;
background: rgba(239, 239, 254, 0.70);
backdrop-filter: blur(6px);
      border-radius: 50px;
      padding: 25px 25px;
      z-index: 999;
      width: auto;
      margin-top: 25px;
      /* 👈 بذار خودش با right و left فاصله بگیره */
      max-width: 480px;
      margin: 0 auto;
    }


    .fara-bottom-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .fara-bottom-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #645ef6;
      /* رنگ آیکون‌ها مشابه تصویر */
      font-family: "Bonyade Koodak VF", sans-serif;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.3s ease;
    }

     .fara-bottom-item.active {
color: var(--Text-Primary-Default, #706DF2);

/* English/Button/Small */
font-family: var(--Fonts-En-Primary, "Bonyade Koodak VF");
font-size: var(--Font-Button-Small-Text-Size, 16px);
font-style: normal;
font-weight: 500;
line-height: normal;
    }

    .fara-bottom-item:hover {
      color: #7e74ff;
    }

    .fara-bottom-icon {
    display: flex;        /* 👈 کلید: فعال کردن Flexbox */
    align-items: center;  /* 👈 کلید: وسط‌چین کردن عمودی (آیکون و متن روبروی هم) */
    gap: 6px;             /* فاصله بین آیکون و متن (اختیاری) */
    line-height: 1;
}


  .fara-bottom-text {
  font-size: 16px;
  margin-top: 4px;
  text-decoration: none !important; /* 👈 این خط رو اضافه کن */
}

/* جلوگیری کامل از خط خوردن */
.fara-bottom-nav .fara-bottom-text {
  text-decoration: none !important;
  text-decoration-line: none !important;
}

.fara-bottom-item .fara-bottom-text {
  text-decoration: none !important;
}
.fara-bottom-nav a {
  opacity: 0.5; /* همه کم‌رنگ */
  transition: opacity 0.3s ease;
}

.fara-bottom-nav a.active {
  opacity: 1; /* فقط فعال پررنگ */
}

        /* Hide scrollbar but keep functionality */
        .cards-container::-webkit-scrollbar {
            display: none;
        }

        .cards-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Bottom Fade Overlay */
        .bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 400px;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .bottom-fade.active {
            opacity: 1;
        }

        .bottom-fade::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.50) 0%,
                rgba(0, 0, 0, 0.35) 20%,
                rgba(0, 0, 0, 0.15) 45%,
                rgba(0, 0, 0, 0.05) 65%,
                rgba(0, 0, 0, 0.00) 100%
            );
        }
        /* اضافه کردن به انتهای بخش style */
.icon-item.active {
    background: #706DF2;
    border-color: #706DF2;
}

.icon-item.active svg path {
    stroke: white;
}

.icon-item {
    cursor: pointer;
    transition: all 0.3s ease;
}
/* ===== Header بدون بک‌گراند در صفحه Map ===== */
.map-page .headers-fixed,
.map-page .header {
  background: transparent !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}

/* اگر هدر position: fixed دارد */
.map-page .headers-fixed {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
}
.individual-resort-marker .category-icon svg path {
  stroke: #E2E2FC !important; /* رنگ سفید یا شبیه به رنگ متن */
  width: 16px;
  height: 16px;
}

/* اگر داخل هدر padding یا رنگ مخفی هست */
.map-page .header * {
  background-color: transparent !important;
}

    </style>

    <script>
let map;
let clusterMarkers = [];
let individualMarkers = [];
let allResortData = [];
let initialZoom = 11;
let initialCenter = [33.5186, -86.8104];
let currentZoomLevel = initialZoom;
let activeFilter = null; // 🔥 نگهداری فیلتر فعال

// ================= INIT =================
document.addEventListener('DOMContentLoaded', initApp);
document.addEventListener('deviceready', initApp, false);

function initApp() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView(initialCenter, initialZoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    const resortTypes = ['resorts', 'villas', 'hotels', 'houses', 'apartments', 'farms'];

    allResortData = [
        { name: 'Coalburg', lat: 33.62, lng: -86.91, items: generateItems(10, 33.62, -86.91, resortTypes) },
        { name: 'Fultondale', lat: 33.60, lng: -86.78, items: generateItems(4, 33.60, -86.78, resortTypes) },
        { name: 'Tarrant', lat: 33.58, lng: -86.75, items: generateItems(5, 33.58, -86.75, resortTypes) },
        { name: 'Birmingham', lat: 33.5186, lng: -86.8104, items: generateItems(50, 33.5186, -86.8104, resortTypes) },
        { name: 'Forestdale', lat: 33.56, lng: -86.94, items: generateItems(7, 33.56, -86.94, resortTypes) },
        { name: 'Vestavia Hills', lat: 33.45, lng: -86.78, items: generateItems(8, 33.45, -86.78, resortTypes) },
        { name: 'Hoover', lat: 33.40, lng: -86.81, items: generateItems(20, 33.40, -86.81, resortTypes) }
    ];

    buildBadgePositions();
    renderMarkers();
    setupFilterButtons();
    
    // 🔥 لیسنر برای زوم دستی
    map.on('zoomend', handleZoomChange);
}

// ================= ZOOM HANDLER =================
function handleZoomChange() {
    const newZoom = map.getZoom();
    
    // اگر کاربر دستی زوم کرد (زوم بیشتر از حالت اولیه)
    if (newZoom > initialZoom + 1) {
        // حذف بج‌های مشکی
        clusterMarkers.forEach(m => map.removeLayer(m));
        clusterMarkers = [];
        
        // نمایش بج‌های آبی با توجه به فیلتر فعال
        showAllIndividualMarkers(activeFilter);
    } 
    // اگر به زوم اولیه برگشت
    else if (newZoom <= initialZoom + 1) {
        // حذف بج‌های آبی
        clearIndividualMarkers();
        
        // بازگرداندن بج‌های مشکی
        if (clusterMarkers.length === 0) {
            renderMarkers(activeFilter);
        }
    }
    
    currentZoomLevel = newZoom;
}

// ================= SHOW ALL BLUE BADGES =================
function showAllIndividualMarkers(filterType = null) {
    clearIndividualMarkers();
    
    const bounds = map.getBounds();
    
    allResortData.forEach(location => {
        location.items.forEach(item => {
            // اگر فیلتر فعال است، فقط آیتم‌های فیلتر شده نمایش داده شوند
            if (filterType && item.type !== filterType) {
                return;
            }
            
            const itemLatLng = L.latLng(item.lat, item.lng);
            
            // فقط آیتم‌هایی که در محدوده نمایش نقشه هستند
            if (bounds.contains(itemLatLng)) {
                
                // 🛠️ اصلاح اصلی: اگر فیلتر فعال است از فیلتر، در غیر این صورت از نوع آیتم استفاده کن
                const iconType = filterType || item.type; 

                const marker = L.marker([item.lat, item.lng], {
                    icon: L.divIcon({
                        html: `<div class="individual-resort-marker">
                                   <span class="sparkle category-icon">
                                   ${getCategoryIcon(iconType)}
                                   </span>
                                   ${item.price}
                               </div>`,
                        className: 'custom-marker',
                        iconSize: [80, 35],
                        iconAnchor: [40, 17]
                    })
                }).addTo(map);
                
                marker.on('click', () => {
                    showCards([item], location.name);
                });
                
                individualMarkers.push(marker);
            }
        });
    });
}

    <path d="M8.50609 13.3288C9.5155 13.3288 10.3338 12.5122 10.3338 11.5048C10.3338 10.4974 9.5155 9.68076 8.50609 9.68076C7.49668 9.68076 6.6784 10.4974 6.6784 11.5048C6.6784 12.5122 7.49668 13.3288 8.50609 13.3288Z" stroke="#45454D" stroke-width="1.5" stroke-miterlimit="10"/>
  </g>
</svg>
        `
    };
    
    return icons[type] || icons['resorts'];
}

// ================= DATA =================
function generateItems(count, lat, lng, types) {
    const radius = 0.02;
    return Array.from({ length: count }, (_, i) => {
        const angle = (Math.PI * 2 * i) / count;
        const type = types[Math.floor(Math.random() * types.length)];
        const distance = radius * (0.3 + Math.random() * 0.7);
        return {
            name: `${capitalize(type)} ${i + 1}`,
            lat: lat + Math.cos(angle) * distance,
            lng: lng + Math.sin(angle) * distance,
            price: `$${Math.floor(Math.random() * 150 + 50)}`,
            rating: (3.5 + Math.random() * 1.5).toFixed(1),
            type
        };
    });
}

function getCategoryCounts(items) {
    return items.reduce((acc, item) => {
        acc[item.type] = (acc[item.type] || 0) + 1;
        return acc;
    }, {});
}

function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}

// ================= BADGE POSITIONS =================
function buildBadgePositions() {
    allResortData.forEach(location => {
        const counts = getCategoryCounts(location.items);
        const types = Object.keys(counts);
        const radius = 0.015;
        const angles = [0, 60, 120, 180, 240, 300];

        location.badges = types.map((type, i) => {
            const angle = angles[i % angles.length] * Math.PI / 180;
            return {
                type,
                count: counts[type],
                badgeLat: location.lat + Math.cos(angle) * radius,
                badgeLng: location.lng + Math.sin(angle) * radius
            };
        });
    });
}

// ================= RENDER =================
function renderMarkers(filterType = null) {
    clusterMarkers.forEach(m => map.removeLayer(m));
    clusterMarkers = [];

    allResortData.forEach(location => {
        const badges = filterType
            ? location.badges.filter(b => b.type === filterType)
            : location.badges;

        badges.forEach(badge => {
            const marker = L.marker(
                [badge.badgeLat, badge.badgeLng],
                {
                    icon: L.divIcon({
                        html: `<div class="resort-marker">${badge.count} ${capitalize(badge.type)}</div>`,
                        className: 'custom-marker',
                        iconSize: [120, 40],
                        iconAnchor: [60, 20]
                    })
                }
            ).addTo(map);

            marker.locationData = { ...location, ...badge };

            marker.on('click', () => zoomToLocation(marker.locationData));
            clusterMarkers.push(marker);
        });
    });
}

// ================= ZOOM =================
function zoomToLocation(data) {
    clearIndividualMarkers();
    
    clusterMarkers.forEach(m => map.removeLayer(m));

    map.setView([data.badgeLat, data.badgeLng], map.getZoom() + 2, {
        animate: true,
        duration: 0.5
    });

    setTimeout(() => {
        const filtered = data.items.filter(i => i.type === data.type);
        
        filtered.forEach(item => {
            const marker = L.marker([item.lat, item.lng], {
                icon: L.divIcon({
                    html: ` <div class="individual-resort-marker">
    <span class="sparkle category-icon">
      ${getCategoryIcon(item.type)}
    </span>
    ${item.price}
  </div>`,
                    className: 'custom-marker',
                    iconSize: [80, 35],
                    iconAnchor: [40, 17]
                })
            }).addTo(map);
            individualMarkers.push(marker);
        });

        showCards(filtered, data.name);
    }, 400);
}

// ================= RESET =================
function resetMap() {
    clearIndividualMarkers();
    document.getElementById('cardsContainer').classList.remove('active');
    document.getElementById('bottomFade').classList.remove('active');

    map.setView(initialCenter, initialZoom, {
        animate: true,
        duration: 0.5
    });
    
    renderMarkers(activeFilter); // 🔥 حفظ فیلتر هنگام ریست
}

function clearIndividualMarkers() {
    individualMarkers.forEach(m => map.removeLayer(m));
    individualMarkers = [];
}

// ================= UI =================
function setupFilterButtons() {
    document.querySelectorAll('.icon-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            
            if (activeFilter === type) {
                // غیرفعال کردن فیلتر
                btn.classList.remove('active');
                activeFilter = null;
                resetMap();
                renderMarkers();
            } else {
                // فعال کردن فیلتر جدید
                document.querySelectorAll('.icon-item').forEach(i => i.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = type;
                
                // اگر در حالت زوم هستیم، بج‌های آبی را به‌روز کن
                if (map.getZoom() > initialZoom + 1) {
                    showAllIndividualMarkers(activeFilter);
                } else {
                    // در غیر این صورت بج‌های مشکی را فیلتر کن
                    resetMap();
                    renderMarkers(activeFilter);
                }
            }
        });
    });
}

function showCards(items, area) {
    const wrapper = document.getElementById('cardsWrapper');
    wrapper.innerHTML = '';
    items.forEach(item => {
        wrapper.innerHTML += `
            <div class="resort-card">
                <div class="card-image">
                    <img src="./img/42.png" alt="${item.name}">
                    <div class="card-rating">${item.rating}</div>
                    <div class="card-price-section">
                        <span class="card-price">${item.price}</span>
                        <span class="card-sparkle">${getCategoryIcon(item.type)}</span>
                    </div>
                </div>
                <div class="card-content">
                    <div class="card-title">${item.name}</div>
                    <div class="card-location">${area} • Country</div>
                </div>
            </div>
        `;
    });
    
    document.getElementById('cardsContainer').classList.add('active');
    document.getElementById('bottomFade').classList.add('active');
}


    </script>
    <script>
  const translations = {

    English: {
        map: "map",

    },

    Kurdish: {
        map: "نەخشە",
    },

    Arabic: {
      map: "رسم خريطة",
    },
  };

  function isInsideNoTranslate(el) {
    return el.closest('.booking-card, .city-input, .city-options, .listing-card, .hotel-card, .fara-item-box');
  }

  function changeLanguage(lang) {
    const t = translations[lang];
    if (!t) {
      console.error('Language not found:', lang);
      return;
    }

    // ترجمه textContent
    document.querySelectorAll('[data-i18n]').forEach(el => {
      if (isInsideNoTranslate(el)) return;
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerHTML = t[key];
    });

    // ترجمه placeholder
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      if (isInsideNoTranslate(el)) return;
      const key = el.getAttribute('data-i18n-placeholder');
      if (t[key]) el.setAttribute('placeholder', t[key]);
    });

    // RTL/LTR
 

    localStorage.setItem('selectedLanguage', lang);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('selectedLanguage') || 'English';
    changeLanguage(savedLang);
  });
</script>
